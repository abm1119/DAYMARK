{% extends "base.html" %}
{% block title %}{% if mode=='new' %}New Category{% else %}Edit Category{% endif %} · DAYMARK{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="page-heading mb-6">
    {% if mode=='new' %}New Category{% else %}Edit Category{% endif %}
  </h1>

  <form method="post" class="card p-6 space-y-5">
    <div>
      <label class="block text-sm text-muted mb-1.5">Name *</label>
      <input type="text" name="name" required class="input"
             value="{{ cat.name if cat else '' }}" placeholder="e.g. Research" autofocus>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-muted mb-1.5">Icon (emoji)</label>
        <input type="text" name="icon" class="input" maxlength="4"
               value="{{ cat.icon if cat else '📁' }}" placeholder="📁">
      </div>
      <div>
        <label class="block text-sm text-muted mb-1.5">Color</label>
        <input type="color" name="color" class="input h-10 p-1 cursor-pointer"
               value="{{ cat.color if cat else '#6366f1' }}">
      </div>
    </div>
    <div class="flex items-center justify-between pt-2">
      <a href="{{ url_for('categories_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {% if mode=='new' %}Create{% else %}Save{% endif %}
      </button>
    </div>
  </form>
</div>
{% endblock %}
